# Legacy GPU/experimental reference; not validated for the CPU workflow.
# Retained from b75138f; do not apply to an existing CPU environment.
name: aki_prediction_project_legacy_gpu

channels:
  - pytorch
  - nvidia
  - defaults

dependencies:
  # Core Python version
  - python=3.9 # probably want to migrate to 3.10+ at some point

  # Core deep learning libraries from specified channels
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8 # As specified in the project plan

  # Pip for installing remaining packages
  - pip
  - graphviz

  # Python packages to be installed with pip
  - pip:
      - "autogluon.multimodal"
      - setuptools
      - wheel
      - autogluon
      - vitaldb==1.0.0
      - pandas
      - numpy
      - scipy
      - matplotlib==3.8.4
      - scikit-learn
      - python-docx
      - xgboost
      - kaleido
      - interpret
      - pycatch22
      - optuna
      - shap
      - nvitop
      - numba
      - ipykernel
      - tensorboard
      - psutil
      - ipywidgets
      - rich
      - grad-cam
      - aeon # 1.1.0 for python 3.9, current 1.3.0 for python 3.10+. 1.3.0 supports GPU acceleration
      - tsfresh
