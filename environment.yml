# Primary Catch22 CPU environment, Linux x86_64; run from the repository root.
# Exact binary replay: scripts/cpu/rebuild-from-locks.sh (see locks/README.md).
name: aki_prediction_project
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.16
  - pip=26.2.2
  - setuptools=84.2.1
  - wheel=0.48.0
  - packaging=26.3
  - libgomp=16.2.0
  - ripgrep=15.2.0
  - pip:
      - -r requirements-cpu.txt
